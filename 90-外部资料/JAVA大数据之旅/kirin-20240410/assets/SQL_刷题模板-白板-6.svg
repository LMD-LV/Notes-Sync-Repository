2234</text><path d="M540.31,0 C540.155,0 540.155,60 540,60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="45" width="153.92000000000002" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="616.96" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">row_number()：12345</text><path d="M116,0 C206,0 206,120 296,120" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="180" y="105" width="92.03999999999999" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="226.01999999999998" y="125" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">引申：topN</text><path d="M272.03999999999996,120 C316.02,120 316.02,100 360,100" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="360" y="85" width="646.4899999999996" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="683.2449999999998" y="105" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">首先数据 根据关键字分组 再 count,然后 再 row_number() 开窗里排序(order by count) rn, where取 rn&lt;N</text><path d="M272.03999999999996,120 C316.02,120 316.02,140 360,140" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="360" y="125" width="499.71999999999974" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="609.8599999999999" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">row_number ()over (partition by roomid order by ...) as rn ---&gt; where rn&lt;N</text>
