<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="-252.48 -390.5 3721.6900000000032 749.5" width="3721.6900000000032" height="749.5"
  style="background:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<defs></defs>
<rect x="-252.48" y="-390.5" width="3721.6900000000032" height="749.5" fill="#fff"/>
<rect x="-168.48" y="-18" width="336.96" height="36" rx="8" fill="#EFF0F0" stroke="none"/><text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">查询连续登陆3天以上的用户(字节面试题)</text><path d="M168.48,0 C258.48,0 258.48,-260 348.48,-260" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="180" y="-275" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="-255" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">数据源</text><path d="M260,-260 C310,-260 310,-260 360,-260" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="-275" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="400" y="-255" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M168.48,0 C258.48,0 258.48,-220 348.48,-220" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="180" y="-235" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="-215" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第一步</text><path d="M260,-220 C310,-220 310,-220 360,-220" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="360" y="-235" width="749.8399999999993" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="734.9199999999996" y="-215" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, date_format('date', 'yyyy-mm-dd') as 'date' from test group by id, date_format('date', 'yyyy-mm-dd')</text><path d="M1109.8399999999992,-220 C824.9199999999996,-220 824.9199999999996,-220 540,-220" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="540" y="-235" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-215" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-220 C670,-220 670,-220 720,-220" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="720" y="-235" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-215" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M168.48,0 C258.48,0 258.48,-100 348.48,-100" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="180" y="-115" width="143" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="251.5" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第二步（重中之重）</text><path d="M323,-100 C341.5,-100 341.5,-100 360,-100" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="360" y="-115" width="728.7799999999994" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="724.3899999999996" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, date, date_add(date, -row_number() over(partition by id order by date)) as date1 from 第一步子查询</text><path d="M1088.7799999999993,-100 C814.3899999999996,-100 814.3899999999996,-180 540,-180" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="-195" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-175" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">中间过程</text><path d="M620,-180 C670,-180 670,-180 720,-180" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-195" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-175" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M1088.7799999999993,-100 C814.3899999999996,-100 814.3899999999996,-140 540,-140" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="-155" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-135" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-140 C670,-140 670,-140 720,-140" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-155" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-135" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M1088.7799999999993,-100 C814.3899999999996,-100 814.3899999999996,-60 540,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="-75" width="117" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="598.5" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">知识点补充解释</text><path d="M657,-60 C688.5,-60 688.5,-100 720,-100" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-115" width="240.63" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="840.315" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">开窗函数 over() 和 group by 的区别</text><path d="M960.63,-100 C930.315,-100 930.315,-100 900,-100" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="900" y="-115" width="340.0799999999999" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="1070.04" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">group by 行数会减少，开窗函数 over() 行数不会减少</text><path d="M657,-60 C688.5,-60 688.5,-60 720,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-75" width="166.66000000000003" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="803.33" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">开窗函数 over() 知识点</text><path d="M886.6600000000001,-60 C893.33,-60 893.33,-60 900,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="900" y="-75" width="1574.8199999999995" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="1687.4099999999999" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">普通的聚合函数每组(group by)只返回一个值，而开窗函数(over())则可为窗口中的每行都返回一个值，简单理解，就是对查询的结果多出一列，这一列可以是聚合值，也可以是排序值。开窗函数一般就是说的是 over() 函数，其窗口是由一个 OVER 子句 定义的多行记录</text><path d="M657,-60 C688.5,-60 688.5,-20 720,-20" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-35" width="292.76" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="866.38" y="-15" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select 普通字段 和 聚合函数 不可以一起使用</text><path d="M168.48,0 C258.48,0 258.48,140 348.48,140" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="180" y="125" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第三步</text><path d="M260,140 C310,140 310,140 360,140" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="360" y="125" width="625.1699999999996" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="672.5849999999998" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, date1, count(*) as day_cnt from 第二步子查询 group by id, date1 having count(*) &gt; 3</text><path d="M985.1699999999996,140 C762.5849999999998,140 762.5849999999998,20 540,20" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="540" y="5" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">中间过程</text><path d="M620,20 C670,20 670,20 720,20" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="5" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M985.1699999999996,140 C762.5849999999998,140 762.5849999999998,60 540,60" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="540" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,60 C670,60 670,60 720,60" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M985.1699999999996,140 C762.5849999999998,140 762.5849999999998,180 540,180" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="540" y="165" width="117" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="598.5" y="185" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">知识点补充解释</text><path d="M657,180 C688.5,180 688.5,100 720,100" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="85" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="105" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">行过滤</text><path d="M800,100 C850,100 850,100 900,100" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="900" y="85" width="163.8" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="981.9" y="105" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">where：没分组，先执行</text><path d="M657,180 C688.5,180 688.5,140 720,140" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="125" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">组过滤</text><path d="M800,140 C850,140 850,140 900,140" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="900" y="125" width="170.56" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="985.28" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">having：分组后，再执行</text><path d="M657,180 C688.5,180 688.5,220 720,220" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="205" width="102.83" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="771.415" y="225" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">sql 执行顺序</text><path d="M822.83,220 C861.415,220 861.415,180 900,180" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="900" y="165" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="940" y="185" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M822.83,220 C861.415,220 861.415,220 900,220" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="900" y="205" width="2485.210000000003" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="2142.6050000000014" y="225" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">1. 先执行from,join来确定表之间的连接关系，得到初步的数据。2. where对数据进行普通的初步的筛选。3. group by 分组，各组分别执行having中的普通筛选或者聚合函数筛选。4. 然后再根据我们要的数据进行select，可以是普通字段查询也可以是获取聚合函数的查询结果，如果是聚合函数，select的查询结果会新增一条字段。5. 将查询结果去重distinct。6. 最后合并各组的查询结果，按照order by的条件进行排序。</text><path d="M822.83,220 C861.415,220 861.415,260 900,260" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="900" y="245" width="422.4999999999999" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="1111.25" y="265" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">快速记忆（记两头）：前两个 先from和where，后两个 select和排序</text>
</svg>