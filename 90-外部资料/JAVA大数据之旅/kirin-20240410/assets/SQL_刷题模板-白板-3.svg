<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="-280 -633.25 1942.4899999999996 1013" width="1942.4899999999996" height="1013"
  style="background:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<defs></defs>
<rect x="-280" y="-633.25" width="1942.4899999999996" height="1013" fill="#fff"/>
<rect x="-196" y="-18" width="392" height="36" rx="8" fill="#EFF0F0" stroke="none"/><text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">每个用户间断一天也算作连续，连续登录最大天数</text><path d="M196,0 C286,0 286,-160 376,-160" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="180" y="-175" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="-155" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">数据源</text><path d="M260,-160 C310,-160 310,-180 360,-180" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="-195" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="400" y="-175" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M260,-160 C310,-160 310,-140 360,-140" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="-155" width="353.0799999999999" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="536.54" y="-135" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">解释：如果一个用户在1,3,5,6登入，则视为连续6天登入</text><path d="M196,0 C286,0 286,-100 376,-100" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="180" y="-115" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第一步</text><path d="M260,-100 C310,-100 310,-100 360,-100" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="360" y="-115" width="939.2499999999989" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="829.6249999999994" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select user_id, login_date, lag(login_date, 1, '1970-01-01') over (partition by user_id order by login_date) last_login_date from test_login</text><path d="M1299.2499999999989,-100 C919.6249999999994,-100 919.6249999999994,-100 540,-100" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="540" y="-115" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-100 C670,-100 670,-100 720,-100" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="720" y="-115" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-95" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M196,0 C286,0 286,-60 376,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="180" y="-75" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第二步</text><path d="M260,-60 C310,-60 310,-60 360,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="360" y="-75" width="636.0899999999996" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="678.0449999999998" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select user_id, login_date, datediff(login_date, last_login_date) date_diff from 第一步子查询</text><path d="M996.0899999999996,-60 C768.0449999999998,-60 768.0449999999998,-60 540,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="-75" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-60 C670,-60 670,-60 720,-60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-75" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M196,0 C286,0 286,0 376,0" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="180" y="-15" width="143" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="251.5" y="5" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第三步（重中之重）</text><path d="M323,0 C341.5,0 341.5,0 360,0" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="360" y="-15" width="1182.0899999999986" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="951.0449999999993" y="5" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select user_id, login_date, sum(if(date_diff &gt; 2, 1, 0)) over (partition by user_id order by login_date rows between unboundedpreceding and current row) group_id from 第二步子查询</text><path d="M1542.0899999999986,0 C1041.0449999999992,0 1041.0449999999992,-20 540,-20" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="540" y="-35" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-15" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-20 C670,-20 670,-20 720,-20" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="-35" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-15" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M1542.0899999999986,0 C1041.0449999999992,0 1041.0449999999992,20 540,20" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="540" y="5" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">说明</text><path d="M620,20 C670,20 670,20 720,20" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="720" y="5" width="807.04" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="1123.52" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">相邻两次登录日期差值小于等于2的数据为一个连续登录组，每遇到相邻两次登录日期差值大于2的数据，分组编号+1，更换连续登录组。</text><path d="M196,0 C286,0 286,80 376,80" fill="none" stroke="#77C386" stroke-width="2"/><rect x="180" y="65" width="143" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="251.5" y="85" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第四步（重中之重）</text><path d="M323,80 C341.5,80 341.5,80 360,80" fill="none" stroke="#77C386" stroke-width="2"/><rect x="360" y="65" width="947.3099999999989" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="833.6549999999995" y="85" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select user_id, group_id, (datediff(max(login_date), min(login_date)) + 1) continuous_login_days from 第三步子查询 group by user_id, group_id</text><path d="M1307.309999999999,80 C923.6549999999995,80 923.6549999999995,60 540,60" fill="none" stroke="#77C386" stroke-width="2"/><rect x="540" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,60 C670,60 670,60 720,60" fill="none" stroke="#77C386" stroke-width="2"/><rect x="720" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M1307.309999999999,80 C923.6549999999995,80 923.6549999999995,100 540,100" fill="none" stroke="#77C386" stroke-width="2"/><rect x="540" y="85" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="105" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">说明</text><path d="M620,100 C670,100 670,100 720,100" fill="none" stroke="#77C386" stroke-width="2"/><rect x="720" y="85" width="449.93" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="944.965" y="105" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">每个连续登录日期组中，最大日期 - 最小日期差值+1 即为连续登录天数。</text><path d="M196,0 C286,0 286,140 376,140" fill="none" stroke="#E48484" stroke-width="2"/><rect x="180" y="125" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第五步</text><path d="M260,140 C310,140 310,140 360,140" fill="none" stroke="#E48484" stroke-width="2"/><rect x="360" y="125" width="701.4799999999993" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="710.7399999999997" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select user_id, max(continuous_login_days) max_continuous_login_days from 第四步子查询 group by user_id</text><path d="M1061.4799999999993,140 C800.7399999999997,140 800.7399999999997,140 540,140" fill="none" stroke="#E48484" stroke-width="2"/><rect x="540" y="125" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,140 C670,140 670,140 720,140" fill="none" stroke="#E48484" stroke-width="2"/><rect x="720" y="125" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="145" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M196,0 C286,0 286,180 376,180" fill="none" stroke="#E482D4" stroke-width="2"/><rect x="180" y="165" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="185" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">拓展</text><path d="M260,180 C310,180 310,180 360,180" fill="none" stroke="#E482D4" stroke-width="2"/><rect x="360" y="165" width="1218.4899999999996" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="969.2449999999998" y="185" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">对于求每个用户最大的连续登陆天数，断一天还算连续登录（两个日期的差小于或等于 2 ），这个需求可以扩展为断n天还算连续登录，只需要修改sum(if(date_diff &gt; 2, 1, 0)) over(...)，2换成n+1即可。</text>
</svg>