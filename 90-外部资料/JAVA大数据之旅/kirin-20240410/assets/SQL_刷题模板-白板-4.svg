<rect x="-52" y="-18" width="104" height="36" rx="8" fill="#EFF0F0" stroke="none"/><text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">波峰波谷</text><path d="M52,0 C142,0 142,-40 232,-40" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="180" y="-55" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="-35" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">数据源</text><path d="M260,-40 C310,-40 310,-60 360,-60" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="-75" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="400" y="-55" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M260,-40 C310,-40 310,-20 360,-20" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="-35" width="813.8" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="766.9" y="-15" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">表a字段 股票id 日期ds 价格price 求出股票波峰波谷，波峰：当天的价格大于前一天和后一天，波谷：当天的价格小于前一天和后一天）</text><path d="M52,0 C142,0 142,20 232,20" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="180" y="5" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第一步</text><path d="M260,20 C310,20 310,20 360,20" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="360" y="5" width="1002.8199999999987" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="861.4099999999994" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, ds, price, lag(price, 1) over (partition by id order by ds)  lag_price, lead(price, 1) over (partition by id order by ds) lead_price from test</text><path d="M1362.8199999999988,20 C951.4099999999994,20 951.4099999999994,20 540,20" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="540" y="5" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,20 C670,20 670,20 720,20" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="720" y="5" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="25" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M52,0 C142,0 142,60 232,60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="180" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第二步</text><path d="M260,60 C310,60 310,60 360,60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="360" y="45" width="1159.9899999999984" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="939.9949999999992" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, ds, price, case when price &gt; lag_price and price &gt; lead_price then '波峰' when price &lt; lag_price and price &lt; lead_price then '波谷' end as price_type from 第一步子查询</text><path d="M1519.9899999999984,60 C1029.9949999999992,60 1029.9949999999992,60 540,60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,60 C670,60 670,60 720,60" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="45" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="65" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text>
