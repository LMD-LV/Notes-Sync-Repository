<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="-264.32 -464.5 2823.14 768" width="2823.14" height="768"
  style="background:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<defs></defs>
<rect x="-264.32" y="-464.5" width="2823.14" height="768" fill="#fff"/>
<rect x="-180.32" y="-18" width="360.64" height="36" rx="8" fill="#EFF0F0" stroke="none"/><text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">每个用户查询连续登入最大天数(字节面试题)</text><path d="M180.32,0 C270.32,0 270.32,-160 360.32,-160" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="180" y="-175" width="80" height="30" rx="6" fill="#EFF0F0" stroke="none"/><text x="220" y="-155" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">数据源</text><path d="M260,-160 C310,-160 310,-160 360,-160" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="-175" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="400" y="-155" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M180.32,0 C270.32,0 270.32,-120 360.32,-120" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="180" y="-135" width="80" height="30" rx="6" fill="#EFF0F0" stroke="none"/><text x="220" y="-115" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第一步</text><path d="M260,-120 C310,-120 310,-120 360,-120" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="360" y="-135" width="749.8399999999993" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="734.9199999999996" y="-115" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, date_format('date', 'yyyy-mm-dd') as 'date' from test group by id, date_format('date', 'yyyy-mm-dd')</text><path d="M1109.8399999999992,-120 C824.9199999999996,-120 824.9199999999996,-120 540,-120" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="540" y="-135" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-115" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-120 C670,-120 670,-120 720,-120" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="720" y="-135" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-115" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M180.32,0 C270.32,0 270.32,0 360.32,0" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="180" y="-15" width="143" height="30" rx="6" fill="#EFF0F0" stroke="none"/><text x="251.5" y="5" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第二步（重中之重）</text><path d="M323,0 C341.5,0 341.5,0 360,0" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="360" y="-15" width="728.7799999999994" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="724.3899999999996" y="5" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, date, date_add(date, -row_number() over(partition by id order by date)) as date1 from 第一步子查询</text><path d="M1088.7799999999993,0 C814.3899999999996,0 814.3899999999996,-80 540,-80" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="-95" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-75" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">中间过程</text><path d="M620,-80 C670,-80 670,-80 720,-80" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-95" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-75" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M1088.7799999999993,0 C814.3899999999996,0 814.3899999999996,-40 540,-40" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="-55" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="-35" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,-40 C670,-40 670,-40 720,-40" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-55" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="-35" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M1088.7799999999993,0 C814.3899999999996,0 814.3899999999996,40 540,40" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="540" y="25" width="117" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="598.5" y="45" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">知识点补充解释</text><path d="M657,40 C688.5,40 688.5,0 720,0" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="-15" width="240.63" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="840.315" y="5" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">开窗函数 over() 和 group by 的区别</text><path d="M960.63,0 C930.315,0 930.315,0 900,0" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="900" y="-15" width="340.0799999999999" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="1070.04" y="5" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">group by 行数会减少，开窗函数 over() 行数不会减少</text><path d="M657,40 C688.5,40 688.5,40 720,40" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="25" width="166.66000000000003" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="803.33" y="45" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">开窗函数 over() 知识点</text><path d="M886.6600000000001,40 C893.33,40 893.33,40 900,40" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="900" y="25" width="1574.8199999999995" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="1687.4099999999999" y="45" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">普通的聚合函数每组(group by)只返回一个值，而开窗函数(over())则可为窗口中的每行都返回一个值，简单理解，就是对查询的结果多出一列，这一列可以是聚合值，也可以是排序值。开窗函数一般就是说的是 over() 函数，其窗口是由一个 OVER 子句 定义的多行记录</text><path d="M657,40 C688.5,40 688.5,80 720,80" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="720" y="65" width="292.76" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="866.38" y="85" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select 普通字段 和 聚合函数 不可以一起使用</text><path d="M180.32,0 C270.32,0 270.32,120 360.32,120" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="180" y="105" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="125" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第三步</text><path d="M260,120 C310,120 310,120 360,120" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="360" y="105" width="485.28999999999985" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="602.645" y="125" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, date, count(*) as day_cnt from 第二步子查询 group by id, date</text><path d="M845.2899999999998,120 C692.645,120 692.645,120 540,120" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="540" y="105" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="125" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,120 C670,120 670,120 720,120" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="720" y="105" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="125" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M180.32,0 C270.32,0 270.32,160 360.32,160" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="180" y="145" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="220" y="165" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第四步</text><path d="M260,160 C310,160 310,160 360,160" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="360" y="145" width="444.59999999999985" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="582.3" y="165" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">select id, max(day_cnt) max_day_cnt from 第三步子查询 group by id</text><path d="M804.5999999999999,160 C672.3,160 672.3,160 540,160" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="540" y="145" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="580" y="165" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">结果</text><path d="M620,160 C670,160 670,160 720,160" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="720" y="145" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="760" y="165" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text>
</svg>