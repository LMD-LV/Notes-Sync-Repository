<rect x="-118" y="-2" width="104" height="36" rx="8" fill="#EFF0F0" stroke="none"/><text x="-66" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">租房亏空</text><path d="M-14,16 C76,16 76,-64 166,-64" fill="none" stroke="#A287E1" stroke-width="2"/><rect x="114" y="-79" width="286.52" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="257.26" y="-59" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">第一次尝试自己调度钱,没有经验,不知道比率</text><path d="M-14,16 C76,16 76,-24 166,-24" fill="none" stroke="#6F81DB" stroke-width="2"/><rect x="114" y="-39" width="488.28" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="358.14" y="-19" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">对于未来的残酷没有充分的认知,对于未来的幻想导致没有采取保险的措施(短租)</text><path d="M-14,16 C76,16 76,16 166,16" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="114" y="1" width="514.28" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="371.14" y="21" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">不经常与人打交道的前提下,不去主动的了解,往往找房都很急,缩短了自己的选择窗口</text><path d="M628.28,16 C461.14,16 461.14,16 294,16" fill="none" stroke="#6EC4C4" stroke-width="2"/><rect x="294" y="1" width="80" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="334" y="21" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></text><path d="M-14,16 C76,16 76,56 166,56" fill="none" stroke="#DFB85D" stroke-width="2"/><rect x="114" y="41" width="377.52" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="302.76" y="61" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">对于人性没有充分的认知,提前把押金交了出去,错失了选择权</text><path d="M-14,16 C76,16 76,96 166,96" fill="none" stroke="#77C386" stroke-width="2"/><rect x="114" y="81" width="461.76" height="30" rx="6" fill="#fafafa" stroke="none"/><text x="344.88" y="101" text-anchor="middle" font-size="13" fill="#333" font-family="-apple-system,BlinkMacSystemFont,sans-serif">对于第一次租房被二房东坑了六百的手续,对于上一个阴面的房间的耿耿于怀</text>
</svg>